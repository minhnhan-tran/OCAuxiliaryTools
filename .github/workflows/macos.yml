name: MacOS
on: 
  push:
    paths:
      - '*.pro'
      - '**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - '*.pro'
      - '**'
      - '.github/workflows/macos.yml' 
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel]
        # qt_ver: [5.9.9,5.12.10,5.15.2]
        qt_ver: [5.15.2]
        #qt_ver: [6.0.0]
        qt_arch: [clang_64]
        
    env:
      targetName: OCAuxiliaryTools
      VERSION: Mac
      orgName: OCAT
      
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cache: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: build macos
        run: |
          qmake
          make
          
      # a release tag must equal the version compiled into the app, or the in-app updater rejects the download
      - name: check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep -o 'CurVersion = "[^"]*"' src/aboutdialog.cpp | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME}" = "v${VER}" ] || { echo "tag ${GITHUB_REF_NAME} != v${VER}"; exit 1; }

      # package: bundle Qt + Database, ad-hoc sign, build the dmg (see scripts/package-macos.sh)
      - name: package
        run: |
          sh scripts/package-macos.sh bin/release/${targetName}.app bin/release/${targetName}.dmg

      # 上传artifacts          
      - uses: actions/upload-artifact@v4
        with:
          #name: ${{ env.targetName }}_${{ matrix.os }}_${{matrix.qt_ver}} # .zip
          name: ${{ env.orgName }}_${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg
          
      # tag 上传Release
      - name: uploadRelease
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          
          #asset_name: ${{ env.targetName }}_${{ matrix.os }}_${{ matrix.qt_ver }}.dmg
          asset_name: ${{ env.orgName }}_${{ env.VERSION }}.dmg
          
          tag: ${{ github.ref }}
          overwrite: true
